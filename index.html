<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Literatura 📚</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="contenedor">

  <!-- PANTALLA DE BIENVENIDA -->
  <section id="pantallaInicio" class="pantalla activa">
    <div class="foto-ojitos">
      <!-- ⬇️ REEMPLAZA "foto.jpg" POR TU FOTO ⬇️ -->
      <img src="foto.jpg" alt="Ojitos de cariño">
      <div class="nombre-ojitos">Repasa ya no falta nada </div>
    </div>

    <h1>Examen de Literatura</h1>
    <p class="subtitulo">Repaso para el domingo </p>

    <div class="info-inicio">
      <p>📝 <strong>20 preguntas</strong> de opción múltiple</p>
      <p>🎯 Temas: Mío Cid, Lazarillo, Don Quijote y Bécquer</p>
      <p>💡 Verás la justificación después de cada respuesta</p>
    </div>

    <button class="btn-principal" id="btnComenzar">Comenzar repaso 💖</button>
  </section>

  <!-- PANTALLA DEL EXAMEN -->
  <section id="pantallaExamen" class="pantalla">
    <div class="encabezado-examen">
      <div class="contador-preguntas">
        Pregunta <span id="numPregunta">1</span> de <span id="totalPreguntas">20</span>
      </div>
      <div class="tema-pregunta" id="temaPregunta"></div>
    </div>

    <div class="progreso-contenedor">
      <div class="progreso" id="progreso"></div>
    </div>

    <div class="pregunta-contenedor">
      <h2 id="textoPregunta"></h2>
      <div id="opcionesContainer"></div>
      <div class="justificacion" id="justificacion"></div>
    </div>

    <div class="botones-navegacion">
      <button class="btn-secundario" id="btnAnterior" disabled>← Anterior</button>
      <button class="btn-principal" id="btnSiguiente" disabled>Siguiente →</button>
    </div>
  </section>

  <!-- PANTALLA FINAL -->
  <section id="pantallaFinal" class="pantalla">
    <div class="resultado-final">
      <div class="corazon-grande">❤️</div>
      <h1>¡Examen terminado!</h1>
      <div class="puntaje-grande" id="puntajeFinal">0 / 20</div>
      <div class="porcentaje" id="porcentajeFinal">0%</div>
      <p class="mensaje-final" id="mensajeFinal"></p>

      <div class="resumen-temas" id="resumenTemas"></div>

      <div class="botones-finales">
        <button class="btn-secundario" id="btnRepasar">Repasar de nuevo 🔄</button>
        <button class="btn-principal" id="btnVerErrores">Ver solo errores ❌</button>
      </div>
    </div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
