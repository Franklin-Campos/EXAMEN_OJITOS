<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Repaso - Educación Cívica 💖</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Fondo animado -->
    <div class="bg-gradient"></div>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="app-container">
        
        <!-- PANTALLA DE INICIO -->
        <section id="start-screen" class="screen active">
            <div class="glass-card start-card">
                <div class="photo-wrapper">
                    <div class="photo-ring"></div>
                    <!-- REEMPLAZA foto.jpg por tu imagen -->
                    <img src="foto.jpg" alt="Para ti" class="profile-photo" id="profile-photo">
                    <span class="heart-badge">💖</span>
                </div>
                <h1>¡Hola, preciosa!</h1>
                <p class="subtitle">Este es tu repaso de <strong>Educación Cívica del Perú</strong>. He preparado estas preguntas con mucho cariño para que llegues súper preparada. ¡Tú puedes con esto y más!</p>
                <div class="info-pills">
                    <span class="pill">📝 30 preguntas</span>
                    <span class="pill">⭐ Nota 1-20</span>
                    <span class="pill">⏱️ Sin límite</span>
                </div>
                <button id="start-btn" class="btn-main">Comenzar Examen ✨</button>
            </div>
        </section>

        <!-- PANTALLA DE EXAMEN -->
        <section id="quiz-screen" class="screen">
            <div class="glass-card quiz-card">
                <header class="quiz-header">
                    <div class="progress-info">
                        <span id="question-counter">1 / 30</span>
                        <span id="score-live">⭐ 0</span>
                    </div>
                    <div class="progress-track">
                        <div id="progress-bar" class="progress-fill"></div>
                    </div>
                </header>
                
                <h2 id="question-text" class="question-text">Cargando...</h2>
                
                <div id="options-container" class="options-list"></div>

                <div id="feedback-container" class="feedback-box hidden">
                    <p id="feedback-text"></p>
                    <button id="next-btn" class="btn-next hidden">Siguiente ➡️</button>
                </div>
            </div>
        </section>

        <!-- PANTALLA DE RESULTADOS -->
        <section id="result-screen" class="screen">
            <div class="glass-card result-card">
                <div class="result-emoji" id="result-emoji">🎉</div>
                <h1 id="result-title">¡Examen Terminado!</h1>
                <div class="score-display">
                    <span id="final-score">0</span>
                    <span class="score-total">/ 20</span>
                </div>
                <p id="result-message" class="result-message"></p>
                <button id="restart-btn" class="btn-main">Intentar de nuevo 🔄</button>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
